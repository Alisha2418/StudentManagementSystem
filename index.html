<!DOCTYPE html>
<html lang="en">
<head>

  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <ul id="studentList"></ul>

  <script src="script.js"></script>
</body>
</html>
